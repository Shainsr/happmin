name: Build Happ Pro APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup project and fix Kotlin & SharedPreferences
        run: |
          cat << 'EOF' > pubspec.yaml
          name: happ_vpn
          description: Happ Pro VPN Client
          publish_to: 'none'
          version: 2.2.0+4

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_v2ray: ^1.0.8
            shared_preferences: ^2.3.2
            google_fonts: ^6.2.1

          flutter:
            uses-material-design: true
          EOF
          rm -rf android test pubspec.lock
          flutter create --platforms=android --org com.happ --project-name happ_vpn .
          
          # بروزرسانی نسخه Kotlin در فایل تنظیمات اندروید برای سازگاری با shared_preferences
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "1.9.22" apply false/g' android/settings.gradle || true
          
          # اعمال تنظیمات امنیتی VPN و پکیج‌ها
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"\/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <application android:extractNativeLibs="true"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 33/g' android/app/build.gradle || true
          sed -i 's/android {/android {\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/g' android/app/build.gradle

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Happ-Pro-APK
          path: build/app/outputs/flutter-apk/*.apk
