name: Build SHIN APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: false

      - name: Customize App Name to SHIN & Generate White 'S' Icon
        run: |
          # ۱. نصب کتابخانه پردازش تصویر پایتون
          sudo apt-get update && sudo apt-get install -y python3-pil

          # ۲. تنظیم کامل متغیرهای متنی برنامه و ویجت در strings.xml
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">SHIN</string>
              <string name="qs_tile_label">SHIN</string>
              <string name="widget_description">SHIN Quick Connect Widget</string>
              <string name="widget_name">SHIN Widget</string>
          </resources>
          EOF

          sed -i 's/android:label="[^"]*"/android:label="SHIN"/g' android/app/src/main/AndroidManifest.xml

          # ۳. تولید خودکار آیکون‌های سفید با حرف S
          python3 - << 'PYEOF'
          import os
          from PIL import Image, ImageDraw, ImageFont

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              out_dir = f"android/app/src/main/res/{folder}"
              os.makedirs(out_dir, exist_ok=True)
              img = Image.new("RGBA", (size, size), (255, 255, 255, 255))
              draw = ImageDraw.Draw(img)

              font_size = int(size * 0.68)
              font = None
              for fpath in [
                  "assets/fonts/Vazirmatn-Black.ttf",
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              ]:
                  if os.path.exists(fpath):
                      font = ImageFont.truetype(fpath, font_size)
                      break
              if font is None:
                  font = ImageFont.load_default()

              bbox = draw.textbbox((0, 0), "S", font=font)
              w = bbox[2] - bbox[0]
              h = bbox[3] - bbox[1]
              x = (size - w) / 2 - bbox[0]
              y = (size - h) / 2 - bbox[1]
              draw.text((x, y), "S", fill=(11, 15, 25, 255), font=font)
              img.save(f"{out_dir}/ic_launcher.png")
          PYEOF

      - name: Fix Gradle Wrapper & AGP Compatibility
        run: |
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-all.zip
          EOF

          cat << 'EOF' > android/settings.gradle.kts
          pluginManagement {
              val flutterSdkPath = run {
                  val properties = java.util.Properties()
                  file("local.properties").inputStream().use { properties.load(it) }
                  val flutterSdkPath = properties.getProperty("flutter.sdk")
                  require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                  flutterSdkPath
              }
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id("dev.flutter.flutter-plugin-loader") version "1.0.0"
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.1.0" apply false
          }
          include(":app")
          EOF

      - name: Clean & Install Dependencies
        run: |
          flutter pub cache clean --force
          flutter pub get

      - name: Generate Official Release Keystore (Play Protect Safe)
        run: |
          rm -f android/app/release-key.jks
          keytool -genkey -v \
            -keystore android/app/release-key.jks \
            -alias shainvpn_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ShainVpn@2026! \
            -keypass ShainVpn@2026! \
            -dname "CN=SHIN, OU=Security, O=ShinProxy, L=Tehran, S=Tehran, C=IR"

          cat << 'EOF' > android/key.properties
          storePassword=ShainVpn@2026!
          keyPassword=ShainVpn@2026!
          keyAlias=shainvpn_key
          storeFile=release-key.jks
          EOF

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Generate and Validate Happ-compatible release JSON
        run: |
          cat << 'EOF' > release
          {
            "app": "shin_android",
            "ret": 1,
            "msg": "ok",
            "data": "4.10.1",
            "details": "-SHIN Rebrand with White S Icon\n-Silent Background Widget & Quick Settings Toggle\n-Cyber Neon Connect Button\n-Request Server from Creator Feature"
          }
          EOF
          jq empty release

      - name: Upload Signed Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: SHIN-Signed-Release-APKs
          path: |
            build/app/outputs/flutter-apk/*.apk
            release